  # --- MetaCubeX geoip (ipcidr) ---
  geoip-netflix:
    type: http
    interval: 86400
    behavior: ipcidr
    format: text
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/netflix.list"
  geoip-cn:
    type: http
    interval: 86400
    behavior: ipcidr
    format: text
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.list"

rules:
  # QUIC 阻断 (等效 sing-box: quic → block)
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

  # 应用净化
  - RULE-SET,ac-privacy-ban,🍃 应用净化分流
  - RULE-SET,ac-scam-ban,🍃 应用净化分流
  - RULE-SET,ac-httpdns-ban,🍃 应用净化分流
  - RULE-SET,geosite-category-httpdns-cn,🍃 应用净化分流

  # 广告拦截
  - RULE-SET,geosite-category-ads-all,🛑 广告分流

  # 私有 IP 直连
  - GEOIP,private,DIRECT,no-resolve

  # Claude / OpenAI / GPT
  - RULE-SET,ac-claude-proxy,🤖 Claude分流
  - RULE-SET,ac-chat-proxy,🤖 GPT分流
  - RULE-SET,geosite-openai,🤖 GPT分流

  # 国内直连
  - RULE-SET,ac-china,DIRECT
  - RULE-SET,ac-custom-direct,DIRECT

  # Apple 直连
  - RULE-SET,apple-cn,🍎 直连分流
  - RULE-SET,apple-cn-cdn,🍎 直连分流

  # Microsoft 国内服务
  - RULE-SET,microsoft-cn-cdn,Ⓜ️ 大陆服务分流
  - RULE-SET,geosite-microsoft-cn,Ⓜ️ 大陆服务分流

  # 游戏下载
  - RULE-SET,ac-game-download,🎮 下载分流

  # 游戏国内直连
  - RULE-SET,ac-steam-cn,🎮 直连分流
  - RULE-SET,geosite-games-cn,🎮 直连分流

  # 影视流媒体 (奈飞、Disney、YouTube)
  - RULE-SET,geoip-netflix,🎥 影视流媒体分流,no-resolve
  - RULE-SET,geosite-netflix,🎥 影视流媒体分流
  - RULE-SET,geosite-disney,🎥 影视流媒体分流
  - RULE-SET,geosite-youtube,🎥 影视流媒体分流

  # TikTok & Spotify (默认美国节点)
  - RULE-SET,geosite-tiktok,🎥 TikTok分流
  - RULE-SET,geosite-spotify,🎥 TikTok分流
  - DOMAIN-SUFFIX,capcut.com,🎥 TikTok分流
  - DOMAIN-SUFFIX,capcutapi.com,🎥 TikTok分流
  - DOMAIN-SUFFIX,capcutapi.us,🎥 TikTok分流
  - DOMAIN-SUFFIX,capcutcdn-us.com,🎥 TikTok分流
  - DOMAIN-SUFFIX,byteoversea.net,🎥 TikTok分流
  - DOMAIN-SUFFIX,byteeffecttos-g.com,🎥 TikTok分流
  - DOMAIN-SUFFIX,ibyteimg.com,🎥 TikTok分流
  - DOMAIN-SUFFIX,ibytedtos.com,🎥 TikTok分流

  # 交易所
  - RULE-SET,ac-exchange,🏦 交易所分流
  - RULE-SET,geosite-category-cryptocurrency,🏦 交易所分流

  # Apple 代理
  - RULE-SET,ac-apple-proxy,🍎 代理分流
  - RULE-SET,apple-services,🍎 代理分流

  # GitHub
  - RULE-SET,geosite-github,🚀 手选节点

  # Microsoft 全球服务
  - RULE-SET,geosite-microsoft,Ⓜ️ 服务分流

  # 游戏 (非国内)
  - RULE-SET,ac-xbox-proxy,🎮 分流
  - RULE-SET,geosite-category-games,🎮 分流

  # 自定义代理与 Google
  - DOMAIN-SUFFIX,google.com,🚀 手选节点
  - DOMAIN-SUFFIX,google.dev,🚀 手选节点
  - DOMAIN-SUFFIX,googleapis.com,🚀 手选节点
  - RULE-SET,ac-custom-proxy,🚀 手选节点

  # CDN 与大文件下载代理 (置于具体业务分流之后，防止截胡)
  - RULE-SET,cdn-non-ip,🚀 CDN 分流
  - RULE-SET,cdn-domainset,🚀 CDN 分流
  - RULE-SET,download-non-ip,🚀 CDN 分流
  - RULE-SET,download-domainset,🚀 CDN 分流
  - RULE-SET,ac-cdn-proxy,🚀 CDN 分流

  # 国内域名直连
  - RULE-SET,geosite-cn,DIRECT

  # 国内 IP 且非海外域名 → 直连
  - AND,((RULE-SET,geoip-cn,no-resolve),(NOT,((RULE-SET,geosite-geolocation-not-cn)))),DIRECT

  # 漏网之鱼
  - MATCH,🐟 漏网分流
