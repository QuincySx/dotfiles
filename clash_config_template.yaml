# Clash Meta (mihomo) 配置模板
# 一比一复刻 sing-box 配置

mode: rule
mixed-port: 7890
allow-lan: true
bind-address: '*'
log-level: warning
ipv6: true
find-process-mode: strict
unified-delay: true
tcp-concurrent: true

external-controller: '0.0.0.0:9090'
external-ui: ui
secret: '123456'

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  listen: ':1053'
  ipv6: true
  prefer-h3: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'localhost'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  proxy-server-nameserver:
    - 223.5.5.5
  nameserver:
    - 'quic://dns.alidns.com'
    - 'https://doh.pub/dns-query'
  fallback:
    - 'https://dns.google/dns-query#🚀 手选节点'
    - 'https://cloudflare-dns.com/dns-query#🚀 手选节点'
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
  nameserver-policy:
    'rule-set:ac-chat-proxy,geosite-openai':
      - 'https://dns.google/dns-query#🚀 手选节点'
    'rule-set:apple-cn,apple-cn-cdn,ac-china,ac-custom-direct,geosite-cn':
      - 'quic://dns.alidns.com'
      - 'https://doh.pub/dns-query'
    'rule-set:microsoft-cn-cdn,geosite-microsoft-cn':
      - 'quic://dns.alidns.com'
      - 'https://doh.pub/dns-query'
    'rule-set:cdn-domainset,download-domainset,ac-cdn-proxy':
      - 'https://dns.google/dns-query#🚀 手选节点'

# url 里填写自己的订阅
proxy-providers:
  provider-subs:
    type: http
    url: "https://xxxxx?target=ClashMeta"
    interval: 86400
    health-check:
      enable: true
      url: 'http://www.gstatic.com/generate_204'
      interval: 1800

proxies:
  - name: "self-hk-chain-01"
    type: ss
    server: 47.79.22.33
    port: 11732
    cipher: aes-128-gcm
    password: "xLsmak5P8j"
    dialer-proxy: "🇭🇰 香港节点"

proxy-groups:
